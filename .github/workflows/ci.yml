name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 앱 — 타입검사 · 단위테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: npx electron-vite build

  server:
    name: 서버 — 타입검사 · 단위테스트 · 배포 검증(dry-run)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: wrangler deploy --dry-run
        run: npx wrangler deploy --dry-run --outdir dist

  build-win:
    name: Windows 패키징 검증
    runs-on: windows-latest
    needs: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:win:dir
      - shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path release -Filter SJTing.exe | Select-Object -First 1
          if (-not $exe) { throw 'SJTing.exe not found' }
          Write-Host "OK: $($exe.FullName)"
