name: Release (Windows installer)

# v* 태그를 푸시하면 Windows x64 NSIS 설치파일을 빌드해 GitHub Releases 에 올린다.
# MVP 는 수동 업데이트 방식이며 코드사이닝은 후속 단계(계획서 8단계).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build & publish installer
        run: npx electron-vite build && npx electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: sjting-windows-x64
          path: |
            release/**/*.exe
            release/**/*.blockmap
            release/**/latest.yml
          if-no-files-found: error
